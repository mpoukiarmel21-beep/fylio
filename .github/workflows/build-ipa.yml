name: Build Fylio IPA

on:
  workflow_dispatch:
  push:
    branches: [master]

jobs:
  build-ipa:
    runs-on: macos-latest
    env:
      CI: 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Clean previous prebuild
        run: |
          rm -rf ios

      - name: Expo prebuild iOS (génère ios/ + installe les pods)
        run: npx expo prebuild --platform ios --clean --no-install

      - name: Install CocoaPods
        run: |
          cd ios
          pod install --repo-update

      - name: List generated files (debug)
        run: ls -la ios/ | head -20

      - name: Build unsigned IPA
        run: |
          cd ios
          WORKSPACE=$(ls -d *.xcworkspace | head -1)
          echo "Workspace trouvé: $WORKSPACE"
          xcodebuild -workspace "$WORKSPACE" \
            -scheme Fylio \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath build/Fylio.xcarchive \
            archive CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO

          cd build
          mkdir -p Payload
          cp -r Fylio.xcarchive/Products/Applications/*.app Payload/
          zip -r ../../Fylio-unsigned.ipa Payload

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Fylio-unsigned-ipa
          path: Fylio-unsigned.ipa
          retention-days: 90
